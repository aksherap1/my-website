<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Akshera Paladhi</title>
  <!-- Custom Image Favicon -->
  <link rel="icon" type="image/png" href="A.png">
  <link rel="stylesheet" href="website.css">
  <style>
    /* Styling for the interactive resume preview and download action */
    .resume-actions {
      margin-bottom: 25px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .download-btn {
      display: inline-block;
      background-color: var(--accent-purple, #6527e7);
      color: #fff;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .download-btn:hover {
      background-color: var(--accent-purple-hover, #4e18be);
    }

    .view-native-link {
      font-size: 14px;
      color: var(--text-muted, #71717e);
      text-decoration: underline;
    }

    .view-native-link:hover {
      color: var(--accent-purple, #6527e7);
    }

    .resume-viewer-container {
      width: 100%;
      height: 70vh;
      min-height: 480px;
      max-height: 800px;
      border: 1px solid var(--border-subtle, #eae6f5);
      border-radius: 6px;
      overflow: hidden;
      background-color: #fff;
      margin-bottom: 20px;
    }

    .resume-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 600px) {
      .resume-viewer-container {
        height: 400px;
        min-height: auto;
      }
    }
  </style>
</head>
<body>

  <div class="portfolio-container">
    <!-- Left Column Navigation Block -->
    <header>
      <nav>
        <ul>
          <li><a href="index.html">About Me</a></li>
          <li><a href="experience.html">Experiences</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="resume.html" class="active">Resume</a></li>
        </ul>
      </nav>
    </header>
   
    <!-- Right Column Main Content Block -->
    <main>
      <!-- Top Links Bar -->
      <div class="top-links-bar">
        <div class="top-links-left">
          <a href="#" id="copy-email">Email</a>
          <a href="https://github.com/aksherap1" target="_blank">Github</a>
          <a href="https://www.linkedin.com/in/akshera-paladhi/" target="_blank">Linkedin</a>
          <a href="https://gitlab.com/apaladhi" target="_blank">Gitlab</a>
        </div>
      </div>

      <div class="intro-header">
        Resume
      </div>

      <!-- Action buttons -->
      <div class="resume-actions">
        <a href="Paladhi Resume.pdf" download="Akshera Paladhi Resume" class="download-btn">
          Download PDF
        </a>
        <a href="Paladhi Resume.pdf" target="_blank" class="view-native-link">
          Open in New Tab
        </a>
      </div>

      <!-- PDF Viewer Frame -->
      <div class="resume-viewer-container">
        <iframe 
          src="Paladhi Resume.pdf#view=FitH" 
          class="resume-frame"
          title="Akshera Paladhi Resume Preview">
          <p>Your browser does not support embedded PDFs. Please use the download link above to view the file.</p>
        </iframe>
      </div>

      <!-- Footer Area -->
      <footer>
        <span>Bay Area, CA</span> &nbsp;·&nbsp; <span>© 2026 Akshera Paladhi</span>
      </footer>
    </main>
  </div>

  <script>
    document.getElementById("copy-email").addEventListener("click", function(e) {
      e.preventDefault();
      navigator.clipboard.writeText("apaladhi@ucsc.edu")
        .then(() => alert("Email copied to clipboard!"))
        .catch(err => console.error("Failed to copy email: ", err));
    });
  </script>
</body>
</html>
